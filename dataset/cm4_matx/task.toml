schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/cm4_matx"
description = "Build a CM4 Micro-ATX Expansion Board"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "extreme"]

[metadata]
project_stem = "cm4_matx"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "extreme"
difficulty_weight = 5.0
order = 9
source_repo_url = "https://github.com/TheGuyDanish/CM4_MATX"
source_commit = "49e365b05a30f671a1a75acfed131d6634abe917"
source_license = "CERN-OHL-P-2.0"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "cm4_matx" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
