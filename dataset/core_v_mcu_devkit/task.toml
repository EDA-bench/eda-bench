schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/core_v_mcu_devkit"
description = "Build a CORE-V MCU Development Kit"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "hard"]

[metadata]
project_stem = "core_v_mcu_devkit"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "hard"
difficulty_weight = 3.0
order = 10
source_repo_url = "https://github.com/openhwgroup/core-v-mcu-devkit"
source_commit = "f038a032e83a53d123a6530e61eae081bd65d73d"
source_license = "Solderpad-2.0"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "core_v_mcu_devkit" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
