schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/cm4_lvds_adapter"
description = "Build a CM4 DSI-to-LVDS Display Adapter"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "very hard"]

[metadata]
project_stem = "cm4_lvds_adapter"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "very hard"
difficulty_weight = 4.0
order = 8
source_repo_url = "https://github.com/antmicro/cm4-baseboard-lvds-adapter"
source_commit = "4af945ed558e58e4b8aea6fe909fc33d78b63f6f"
source_license = "Apache-2.0"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "cm4_lvds_adapter" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
