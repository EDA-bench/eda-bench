schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/jetson_orin_baseboard"
description = "Build a Jetson Orin Baseboard"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "extreme"]

[metadata]
project_stem = "jetson_orin_baseboard"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "extreme"
difficulty_weight = 5.0
order = 15
source_repo_url = "https://github.com/antmicro/jetson-orin-baseboard"
source_commit = "2726359ce8a78a0c30196ee19653419d5dd0ee79"
source_license = "Apache-2.0"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "jetson_orin_baseboard" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
