schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/ftdi_toolkit"
description = "Build a Multi-Voltage FTDI Interface Toolkit"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "very hard"]

[metadata]
project_stem = "ftdi_toolkit"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "very hard"
difficulty_weight = 4.0
order = 11
source_repo_url = "https://github.com/antmicro/ftdi-toolkit"
source_commit = "6e39ebff19d7230bfa5b8266008d1ca5334f2021"
source_license = "Apache-2.0"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "ftdi_toolkit" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
