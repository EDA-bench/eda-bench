schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/robotont_driver_board"
description = "Build an Isolated Motor Driver Board"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "medium"]

[metadata]
project_stem = "robotont_driver_board"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "medium"
difficulty_weight = 2.0
order = 30
source_repo_url = "https://github.com/robotont/robotont-electronics-driver-board"
source_commit = "26db59928930244ff67927d6e02be232c5ea36e5"
source_license = "CERN-OHL-P-2.0"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "robotont_driver_board" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
