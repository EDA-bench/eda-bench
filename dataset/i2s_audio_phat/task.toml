schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/i2s_audio_phat"
description = "Build an I2S Audio pHAT"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "medium"]

[metadata]
project_stem = "i2s_audio_phat"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "medium"
difficulty_weight = 2.0
order = 13
source_repo_url = "https://github.com/skiselev/i2s_audio_phat"
source_commit = "e404771e9ee4fcee3d2b632b78c7fa3143427a97"
source_license = "GPL-3.0"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "i2s_audio_phat" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
