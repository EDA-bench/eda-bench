schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/m2_5g_usb3_interface"
description = "Build an M.2 5G USB 3 Interface Board"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "very hard"]

[metadata]
project_stem = "m2_5g_usb3_interface"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "very hard"
difficulty_weight = 4.0
order = 18
source_repo_url = "https://github.com/themainframe/5g-m2-usb3-interface-pcb"
source_commit = "4bea91de9952e798039c11dd05297152a1531d69"
source_license = "MIT"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "m2_5g_usb3_interface" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
