schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/nanoupdi"
description = "Build a Compact USB-C UPDI Programmer"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "easy"]

[metadata]
project_stem = "nanoupdi"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "easy"
difficulty_weight = 1.5
order = 24
source_repo_url = "https://github.com/umbertoragone/nanoupdi"
source_commit = "4164e6543fb4792d55d54f355b4993d7da171f8f"
source_license = "MIT"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "nanoupdi" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
