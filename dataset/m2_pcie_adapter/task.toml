schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/m2_pcie_adapter"
description = "Build a PCIe x4 to M.2 Key-M Adapter"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "very hard"]

[metadata]
project_stem = "m2_pcie_adapter"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "very hard"
difficulty_weight = 4.0
order = 19
source_repo_url = "https://github.com/antmicro/m2-pcie-adapter"
source_commit = "11844f18ce14393043affde9e7aa8d51c0cd3ba7"
source_license = "Apache-2.0"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "m2_pcie_adapter" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
