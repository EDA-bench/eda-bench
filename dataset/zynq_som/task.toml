schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/zynq_som"
description = "Build a Zynq-7000 System-on-Module"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "extreme"]

[metadata]
project_stem = "zynq_som"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "extreme"
difficulty_weight = 5.0
order = 35
source_repo_url = "https://github.com/pinguz97/Zynq-SoM"
source_commit = "ad96951a225fbf9f263b555ef070a536b09ff710"
source_license = "CERN-OHL-S-2.0"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "zynq_som" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
