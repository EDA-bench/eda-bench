schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/ict_baseboard"
description = "Build an In-Circuit Test Baseboard"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "extreme"]

[metadata]
project_stem = "ict_baseboard"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "extreme"
difficulty_weight = 5.0
order = 14
source_repo_url = "https://github.com/antmicro/ict-baseboard"
source_commit = "181d6ed7d2d9dfb358dd2b64046e3debdf4ee9ac"
source_license = "Apache-2.0"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "ict_baseboard" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
