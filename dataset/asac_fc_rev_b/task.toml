schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/asac_fc_rev_b"
description = "Build an RP2040 Flight Controller Board"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "hard"]

[metadata]
project_stem = "asac_fc_rev_b"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "hard"
difficulty_weight = 3.0
order = 3
source_repo_url = "https://github.com/victorhook/asac-fc"
source_commit = "22b7a665cd4420f75209fa2bdba9e0889cea2e9c"
source_license = "GPL-3.0"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "asac_fc_rev_b" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
