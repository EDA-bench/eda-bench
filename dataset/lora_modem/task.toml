schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/lora_modem"
description = "Build an STM32 LoRa and CAN Modem"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "hard"]

[metadata]
project_stem = "lora_modem"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "hard"
difficulty_weight = 3.0
order = 17
source_repo_url = "https://github.com/wangyeee/OpenHardware"
source_commit = "4e725d69d7705a40a0cc4b638c63e90efd8188ed"
source_license = "MIT"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "lora_modem" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
