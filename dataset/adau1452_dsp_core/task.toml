schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/adau1452_dsp_core"
description = "Build an ADAU1452 DSP Core Board"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "very hard"]

[metadata]
project_stem = "adau1452_dsp_core"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "very hard"
difficulty_weight = 4.0
order = 1
source_repo_url = "https://github.com/ohdsp/DSP-ADAU1452"
source_commit = "f9dd8f794ef30c4f2f248ef84d311dd9712dbfd5"
source_license = "TAPR OHL"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "adau1452_dsp_core" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
