build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
