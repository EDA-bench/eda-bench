authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "easy"]

[metadata]
project_stem = "logic_level_converter_board"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "easy"
difficulty_weight = 1.5
order = 16
source_repo_url = "https://github.com/SolderedElectronics/Logic-level-converter-board-hardware-design"
source_commit = "04a6292926207e7ed268de11d7956ea8a8604e95"
source_license = "TAPR OHL v1.0"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "logic_level_converter_board" }
