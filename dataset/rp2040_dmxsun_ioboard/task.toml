authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "medium"]

[metadata]
project_stem = "rp2040_dmxsun_ioboard"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "medium"
difficulty_weight = 2.0
order = 31
source_repo_url = "https://github.com/OpenLightingProject/rp2040-dmxsun"
source_commit = "f3b1749c982da85770dc9a11eada035404edc25d"
source_license = "Apache-2.0"

[verifier]
timeout_sec = 10800.0
