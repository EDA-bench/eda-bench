schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/cm4_carrier_net"
description = "Build a Compact CM4 Network Carrier"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "hard"]

[metadata]
project_stem = "cm4_carrier_net"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "hard"
difficulty_weight = 3.0
order = 6
source_repo_url = "https://github.com/jkiv/cm4-carriers"
source_commit = "9f901fe6bb9368de55b49fc585e7fb67e0bdb832"
source_license = "BSD-2-Clause"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "cm4_carrier_net" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
