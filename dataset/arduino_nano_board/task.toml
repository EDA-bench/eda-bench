schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/arduino_nano_board"
description = "Build a Nano-Compatible ATmega328P Controller Board"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "easy"]

[metadata]
project_stem = "arduino_nano_board"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "easy"
difficulty_weight = 1.5
order = 2
source_repo_url = "https://github.com/sabogalc/KiCad-Arduino-Boards"
source_commit = "0a25ca25953efb3fb045616e7c676a554ceaabc1"
source_license = "WTFPL"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "arduino_nano_board" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
