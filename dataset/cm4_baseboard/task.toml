schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/cm4_baseboard"
description = "Build a Raspberry Pi CM4 Baseboard"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "extreme"]

[metadata]
project_stem = "cm4_baseboard"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "extreme"
difficulty_weight = 5.0
order = 5
source_repo_url = "https://github.com/antmicro/cm4-baseboard"
source_commit = "d248c2921e8e7f4c9b30c96ea5f376d9b2780f1e"
source_license = "Apache-2.0"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "cm4_baseboard" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
