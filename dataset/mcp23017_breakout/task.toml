schema_version = "1.3"
artifacts = ["/workspace/final_project"]

[task]
name = "eda-bench/mcp23017_breakout"
description = "Build an MCP23017 GPIO Expander Breakout"
authors = [{ name = "EDA-bench authors" }]
keywords = ["eda", "kicad", "very easy"]

[metadata]
project_stem = "mcp23017_breakout"
benchmark = "EDA-bench"
category = "electronic-design-automation"
difficulty = "very easy"
difficulty_weight = 1.0
order = 20
source_repo_url = "https://github.com/SolderedElectronics/IO-expander-MCP23017-breakout-hardware-design"
source_commit = "1d614e5f49013931a2c1fd8460bf48e1b3790c36"
source_license = "TAPR OHL"

[verifier]
timeout_sec = 10800.0
env = { EDA_BENCH_TASK_ID = "mcp23017_breakout" }
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "ghcr.io/eda-bench/eda-bench-verifier:harbor-v1"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0

[agent]
timeout_sec = 10800.0

[environment]
docker_image = "ghcr.io/eda-bench/eda-bench-agent:harbor-v1"
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 30720
gpus = 0
